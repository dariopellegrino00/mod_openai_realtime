name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build integration environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: integration
          load: true
          tags: mod-openai-realtime-integration:ci
          cache-from: type=gha,scope=integration
          cache-to: type=gha,mode=max,scope=integration,ignore-error=true

      - name: Run unit and integration tests
        env:
          INTEGRATION_BASE_IMAGE: mod-openai-realtime-integration:ci
        run: ./tests/run-integration.sh
