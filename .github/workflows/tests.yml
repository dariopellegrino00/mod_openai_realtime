name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: integration-test
          load: true
          tags: mod-openai-audio-stream-integration:test
          cache-from: type=gha,scope=integration-test
          cache-to: type=gha,mode=max,scope=integration-test,ignore-error=true

      - name: Run unit and integration tests
        run: docker run --rm mod-openai-audio-stream-integration:test
